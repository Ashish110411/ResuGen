# Database - reads from environment variables at runtime (Render deployment)
# Falls back to localhost for local dev if env vars are not set
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/resugen_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


server.port=7777

# JPA/Hibernate properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configurations (512-bit key encoded in hex for HS512)
jwt.secret=${JWT_SECRET:d9c3f49b2f4a5fa2223a07573ca49310749a36cdf3061626d032aea4585f5d278ae6bec16d9cf3af490193d6055f849e00e23fb0d7c8502108dad3eb36a8bae5}
jwt.expiration=86400000

# Keep-Alive Service
# In production on Render: keepalive.url pings backend endpoint
# For local dev: set to http://localhost:7777/api/auth/ping or 'disabled'
keepalive.url=${KEEPALIVE_URL:https://resugen.onrender.com/api/auth/ping}
# keepalive.url=http://localhost:7777/api/auth/ping
